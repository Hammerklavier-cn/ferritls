name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). Leave empty for CI only."
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "--features ferritls-core/fips", "--features ferritls-rustls/fips", "--all-features"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets ${{ matrix.features }} -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      # 注意：向量测试在实现落地前全部标记 #[ignore]，CI 默认只验证
      # “骨架编译通过 + 非 ignore 测试绿”。里程碑完成的定义之一是
      # 对应测试移除 ignore 后仍绿（见 AGENTS.md 测试约定）。
      # --all-features 拉起 interop 的 ring 交叉互操作与 webpki 链校验
      # （ring 的 C 构建在三平台 runner 上均可直接编译）。
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features
      - run: cargo test -p ferritls-core --features fips
      - run: cargo test -p ferritls-rustls --features fips

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Build fuzz targets
        run: cargo fuzz build -O
      # 每个 target 冒烟执行 60s / 50k 次，防止回归；持续 fuzz 由
      # OSS-Fuzz 或定期 job 承担（M8+）
      - name: Smoke run
        run: |
          for t in parse_pkcs8 verify_ecdsa verify_ed25519 verify_rsa aead_open ecdh_peer; do
            cargo fuzz run "$t" -- -max_total_time=60 -runs=50000
          done

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  # 发布（M7）：推 tag v*（或手动 dispatch 填 tag）→ 全量门禁 → 发布。
  # 单次 `cargo publish` 即可：cargo 1.90（2025-09 stable）起支持
  # workspace 一次性发布——按依赖拓扑排序（core → rustls）依次打包、
  # 验证、上传，验证阶段经本地 registry overlay 解析同批发布的依赖，
  # 无需等待 crates.io 索引传播（rust-lang/cargo#1169）。interop 为
  # publish=false，自动跳过。前置：仓库 secrets 配置 CARGO_REGISTRY_TOKEN。
  publish:
    needs: [fmt, clippy, test, deny]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches crate version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "Tag: ${TAG} / version: ${VERSION}"
          for crate in ferritls-core ferritls-rustls; do
            CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            echo "${crate}: ${CRATE_VERSION}"
            if [ "${CRATE_VERSION}" != "${VERSION}" ]; then
              echo "::error::${crate} version (${CRATE_VERSION}) does not match tag (${TAG})"
              exit 1
            fi
          done
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # 上传阶段非原子：若 core 已上传而 rustls 失败，重跑本 job 会因
        # core 版本已存在而报错——此时改用 `cargo publish -p
        # ferritls-rustls` 单发补齐即可。
        run: cargo publish
