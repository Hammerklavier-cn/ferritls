name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # 每周全量扫一遍：audit 漏洞公告、慢测试（RFC 7748 1000 轮）、
  # 以及常规门禁的定期回归。
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). Leave empty for CI only."
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  # 默认 feature `simd`（P2）经 #![feature(portable_simd)] 使用 core::simd，
  # stable 工具链上需要 RUSTC_BOOTSTRAP=1（仓内 .cargo/config.toml 同值；
  # 此处显式设置以覆盖 fmt/deny 等不读取仓库构建缓存的步骤，并对
  # tag checkout（发布验证构建）同样生效）。portable_simd 稳定后移除。
  RUSTC_BOOTSTRAP: "1"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "--features ferritls-core/fips", "--features ferritls-rustls/fips", "--all-features"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets ${{ matrix.features }} -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      # 注意：向量测试在实现落地前全部标记 #[ignore]，CI 默认只验证
      # “骨架编译通过 + 非 ignore 测试绿”。里程碑完成的定义之一是
      # 对应测试移除 ignore 后仍绿（见 AGENTS.md 测试约定）。
      # --all-features 拉起 interop 的 ring 交叉互操作与 webpki 链校验
      # （ring 的 C 构建在三平台 runner 上均可直接编译）。
      - run: cargo test --workspace
      - run: cargo test --workspace --all-features
      - run: cargo test -p ferritls-core --features fips
      - run: cargo test -p ferritls-rustls --features fips
      # 标量回退路径（simd feature 关闭 = P1/P1.5 代码）：全链路
      # opt-out 到 ferritls-rustls / interop（AGENTS §5.5 双配置要求）。
      - name: Run tests (scalar fallback)
        run: |
          cargo test -p ferritls-core --no-default-features
          cargo test -p ferritls-rustls --no-default-features
          cargo test -p ferritls-interop --no-default-features
      # 宽 ISA 代码档（P2）：AVX2 在 x86_64 runner 上普遍可用，实跑测试；
      # AVX-512 未必可用，只做编译检查防 SIGILL（本机 Zen 4 实跑兜底）。
      # 两腿均经 CARGO_BUILD_TARGET 显式钉住目标三元组：cargo 只在
      # target 模式下才把 RUSTFLAGS 限定于目标单元；否则宿主侧 build
      # script / proc-macro 也按宽 ISA 编码，在不支持该 ISA 的 runner
      # CPU 上一执行即 SIGILL（0.2.0 CI 的 ring build script 即此死法）。
      - name: Run tests (AVX2 channels)
        if: runner.arch == 'X64'
        env:
          RUSTFLAGS: -C target-feature=+avx2
          CARGO_BUILD_TARGET: ${{ runner.os == 'Linux' && 'x86_64-unknown-linux-gnu' || (runner.os == 'Windows' && 'x86_64-pc-windows-msvc' || 'x86_64-apple-darwin') }}
        run: cargo test -p ferritls-core
      - name: Check (AVX-512 channels, compile only)
        if: runner.arch == 'X64'
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v4
          CARGO_BUILD_TARGET: ${{ runner.os == 'Linux' && 'x86_64-unknown-linux-gnu' || (runner.os == 'Windows' && 'x86_64-pc-windows-msvc' || 'x86_64-apple-darwin') }}
        run: cargo check --workspace --all-targets
      # bench 编译冒烟（防止基准腐化；实际测量在本地/按需进行）
      - if: matrix.os == 'ubuntu-latest'
        run: cargo bench --no-run --workspace

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # cargo fuzz build 经 -Zbuild-std 编译带插桩的 std，需要源码
          components: rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # install-action 分发的 cargo-fuzz 是静态 musl 二进制，其内部默认
      # target 即 x86_64-unknown-linux-musl；而 musl 默认 crt-static 与
      # -Zsanitizer=address 在 rustc 层面不兼容（且该目标 std 未安装），
      # 故对 build/run 显式钉住 gnu：宿主 std 已装、动态 glibc 与 ASan
      # 兼容。
      - name: Build fuzz targets
        run: cargo fuzz build -O --target x86_64-unknown-linux-gnu
      # 每个 target 冒烟执行 60s / 50k 次，防止回归；持续 fuzz 由
      # OSS-Fuzz 或定期 job 承担（M8+）
      - name: Smoke run
        run: |
          for t in parse-pkcs8 verify-ecdsa verify-ed25519 verify-rsa aead-open ecdh-peer; do
            cargo fuzz run --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=60 -runs=50000
          done

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  # 覆盖率度量（M7 后补强）：汇总打进 job 日志，lcov 作为 artifact 供
  # 下载；不接 codecov 等外部服务（需 token 与外部依赖，后续可选）。
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage (lcov)
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Print summary to job log
        run: cargo llvm-cov report
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

  # 依赖漏洞公告扫描：cargo-deny 的 advisories 只在 push/PR 时检查，
  # 公告发布于两次 push 之间时无人感知；本 job（随每周 schedule 与
  # 手动触发）补上时间维度的扫描。根 workspace 与 fuzz/（独立
  # workspace）各查一次。
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      # fuzz/Cargo.lock 刻意不跟踪（fuzz/.gitignore，M7 决定）——审计前
      # 现场生成；cargo fuzz build 同样每次新鲜解析，扫描口径一致。
      - name: Generate fuzz lockfile
        run: cargo generate-lockfile
        working-directory: fuzz
      - run: cargo audit --file fuzz/Cargo.lock

  # 公开 API 兼容性门禁：两个发布 crate 的 semver 违例在 PR 阶段拦截
  # （baseline 默认取最近的版本 tag）。
  semver-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  # 文档门禁：intra-doc 链接与 rustdoc 警告按错误处理（密码库的文档
  # 即安全说明的一部分）。
  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps --all-features

  # 慢测试（平时 #[ignore]）：RFC 7748 §5.2 1000 轮迭代金标准等，
  # 随每周 schedule 与手动触发专职执行。
  slow-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p ferritls-core --test x25519 -- --ignored

  # 发布（M7）：推 tag v*（或手动 dispatch 填 tag）→ 全量门禁 → 发布。
  # 单次 `cargo publish` 即可：cargo 1.90（2025-09 stable）起支持
  # workspace 一次性发布——按依赖拓扑排序（core → rustls）依次打包、
  # 验证、上传，验证阶段经本地 registry overlay 解析同批发布的依赖，
  # 无需等待 crates.io 索引传播（rust-lang/cargo#1169）。interop 为
  # publish=false，自动跳过。前置：仓库 secrets 配置 CARGO_REGISTRY_TOKEN。
  publish:
    needs: [fmt, clippy, test, deny]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches crate version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "Tag: ${TAG} / version: ${VERSION}"
          for crate in ferritls-core ferritls-rustls; do
            CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            echo "${crate}: ${CRATE_VERSION}"
            if [ "${CRATE_VERSION}" != "${VERSION}" ]; then
              echo "::error::${crate} version (${CRATE_VERSION}) does not match tag (${TAG})"
              exit 1
            fi
          done
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # 上传阶段非原子：若 core 已上传而 rustls 失败，重跑本 job 会因
        # core 版本已存在而报错——此时改用 `cargo publish -p
        # ferritls-rustls` 单发补齐即可。
        run: cargo publish
