name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # 每周全量扫一遍：audit 漏洞公告、慢测试（RFC 7748 1000 轮）、
  # 以及常规门禁的定期回归。
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). Leave empty for CI only."
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  # 默认 feature `simd`（P2）经 #![feature(portable_simd)] 使用 core::simd，
  # stable 工具链上需要 RUSTC_BOOTSTRAP=1（仓内 .cargo/config.toml 同值；
  # 此处显式设置以覆盖 fmt/deny 等不读取仓库构建缓存的步骤，并对
  # tag checkout（发布验证构建）同样生效）。portable_simd 稳定后移除。
  RUSTC_BOOTSTRAP: "1"
  # 所有 cargo 调用带 --locked：CI 只验证「已提交的 Cargo.lock」这一种
  # 依赖组合，清单与 lock 的漂移（改了 Cargo.toml 忘了提交 lock）在门禁
  # 阶段直接红，而不是在本地/下游随机暴露。唯一例外是 fuzz job——
  # fuzz/Cargo.lock 刻意不跟踪（见 audit job 注记），加 --locked 必挂。

# 最小权限基线：GITHUB_TOKEN 只保留 checkout 所需的 contents: read；
# 唯一提升点是 publish job（创建 GitHub Release 需 contents: write）。
permissions:
  contents: read

# 同 ref 的后续 PR push 取消排队/在跑的旧 run；cancel-in-progress 只对
# pull_request 生效——main push 与 tag/发布路径永不互相取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        # id 供缓存 key 用（GitHub cache key 不允许空格）；features 是
        # 传给 clippy 的实际参数。
        conf:
          - id: base
            features: ""
          - id: core-fips
            features: "--features ferritls-core/fips"
          - id: rustls-fips
            features: "--features ferritls-rustls/fips"
          - id: all-features
            features: "--all-features"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # 缓存按 matrix 腿隔离：不同 feature 集的依赖编译产物互不复用
          key: ${{ matrix.conf.id }}
      - run: cargo clippy --locked --workspace --all-targets ${{ matrix.conf.features }} -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      # 注意：向量测试在实现落地前全部标记 #[ignore]，CI 默认只验证
      # “骨架编译通过 + 非 ignore 测试绿”。里程碑完成的定义之一是
      # 对应测试移除 ignore 后仍绿（见 AGENTS.md 测试约定）。
      # --all-features 拉起 interop 的 ring 交叉互操作与 webpki 链校验
      # （ring 的 C 构建在三平台 runner 上均可直接编译）。
      - run: cargo test --locked --workspace
      - run: cargo test --locked --workspace --all-features
      - run: cargo test --locked -p ferritls-core --features fips
      - run: cargo test --locked -p ferritls-rustls --features fips
      # 标量回退路径（simd feature 关闭 = P1/P1.5 代码）：全链路
      # opt-out 到 ferritls-rustls / interop（AGENTS §5.5 双配置要求）。
      - name: Run tests (scalar fallback)
        run: |
          cargo test --locked -p ferritls-core --no-default-features
          cargo test --locked -p ferritls-rustls --no-default-features
          cargo test --locked -p ferritls-interop --no-default-features
      # 宽 ISA 代码档（P2）：AVX2 在 x86_64 runner 上普遍可用，实跑测试；
      # AVX-512 未必可用，只做编译检查防 SIGILL（本机 Zen 4 实跑兜底）。
      # 两腿均经 CARGO_BUILD_TARGET 显式钉住目标三元组：cargo 只在
      # target 模式下才把 RUSTFLAGS 限定于目标单元；否则宿主侧 build
      # script / proc-macro 也按宽 ISA 编码，在不支持该 ISA 的 runner
      # CPU 上一执行即 SIGILL（0.2.0 CI 的 ring build script 即此死法）。
      - name: Run tests (AVX2 channels)
        if: runner.arch == 'X64'
        env:
          RUSTFLAGS: -C target-feature=+avx2
          CARGO_BUILD_TARGET: ${{ runner.os == 'Linux' && 'x86_64-unknown-linux-gnu' || (runner.os == 'Windows' && 'x86_64-pc-windows-msvc' || 'x86_64-apple-darwin') }}
        run: cargo test --locked -p ferritls-core
      - name: Check (AVX-512 channels, compile only)
        if: runner.arch == 'X64'
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v4
          CARGO_BUILD_TARGET: ${{ runner.os == 'Linux' && 'x86_64-unknown-linux-gnu' || (runner.os == 'Windows' && 'x86_64-pc-windows-msvc' || 'x86_64-apple-darwin') }}
        run: cargo check --locked --workspace --all-targets
      # bench 编译冒烟（防止基准腐化；实际测量在本地/按需进行）
      - if: matrix.os == 'ubuntu-latest'
        run: cargo bench --locked --no-run --workspace

  # MSRV 门禁：workspace.package 声明的 rust-version（当前 1.88）。
  # 只锚定标量回退路径（--no-default-features）：默认 `simd` feature 经
  # RUSTC_BOOTSTRAP 跟随「当前 stable」的 core::simd 形态，不承诺跨工具
  # 链版本可复现；下游要版本可复现构建即 default-features = false
  # （AGENTS §5.5 的文档化 opt-out）。工具链钉死精确版本——stable 漂移
  # 不应改变 MSRV 判定。调低 rust-version 前先本地实测再改这里。
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - run: rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - run: cargo +1.88.0 check --locked --workspace --no-default-features
      - run: cargo +1.88.0 check --locked -p ferritls-core --no-default-features --features fips
      - run: cargo +1.88.0 check --locked -p ferritls-rustls --no-default-features --features fips

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 本 job 是 --locked 全局策略的唯一例外：fuzz/Cargo.lock 刻意不跟踪
    # （fuzz/.gitignore，M7 决定），cargo fuzz build 每次新鲜解析，与
    # audit job 的现场 generate-lockfile 口径一致；加 --locked 必挂。
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          # cargo fuzz build 经 -Zbuild-std 编译带插桩的 std，需要源码
          components: rust-src
      # fuzz/ 是独立 workspace（自己的 lockfile），单独缓存其依赖编译
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # install-action 分发的 cargo-fuzz 是静态 musl 二进制，其内部默认
      # target 即 x86_64-unknown-linux-musl；而 musl 默认 crt-static 与
      # -Zsanitizer=address 在 rustc 层面不兼容（且该目标 std 未安装），
      # 故对 build/run 显式钉住 gnu：宿主 std 已装、动态 glibc 与 ASan
      # 兼容。
      - name: Build fuzz targets
        run: cargo fuzz build -O --target x86_64-unknown-linux-gnu
      # 每个 target 冒烟执行 60s / 50k 次，防止回归；持续 fuzz 由
      # OSS-Fuzz 或定期 job 承担（M8+）
      - name: Smoke run
        run: |
          for t in parse-pkcs8 verify-ecdsa verify-ed25519 verify-rsa aead-open ecdh-peer mlkem-decaps; do
            cargo fuzz run --target x86_64-unknown-linux-gnu "$t" -- -max_total_time=60 -runs=50000
          done

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --locked check

  # 覆盖率度量（M7 后补强）：汇总打进 job 日志，lcov 作为 artifact 供
  # 下载；不接 codecov 等外部服务（需 token 与外部依赖，后续可选）。
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage (lcov)
        run: cargo llvm-cov --locked --workspace --all-features --lcov --output-path lcov.info
      - name: Print summary to job log
        run: cargo llvm-cov report
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info

  # 依赖漏洞公告扫描：cargo-deny 的 advisories 只在 push/PR 时检查，
  # 公告发布于两次 push 之间时无人感知；本 job（随每周 schedule 与
  # 手动触发）补上时间维度的扫描。根 workspace 与 fuzz/（独立
  # workspace）各查一次。
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      # fuzz/Cargo.lock 刻意不跟踪（fuzz/.gitignore，M7 决定）——审计前
      # 现场生成；cargo fuzz build 同样每次新鲜解析，扫描口径一致。
      - name: Generate fuzz lockfile
        run: cargo generate-lockfile
        working-directory: fuzz
      - run: cargo audit --file fuzz/Cargo.lock

  # 公开 API 兼容性门禁：两个发布 crate 的 semver 违例在 PR 阶段拦截
  # （baseline 默认取最近的版本 tag）。
  semver-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: obi1kenobi/cargo-semver-checks-action@v2

  # 文档门禁：intra-doc 链接与 rustdoc 警告按错误处理（密码库的文档
  # 即安全说明的一部分）。
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --no-deps --all-features

  # 慢测试（平时 #[ignore]）：RFC 7748 §5.2 1000 轮迭代金标准等，
  # 不阻塞日常 PR/push；每周全量（schedule）、手动触发、以及发布路径
  # （tag push，经 publish.needs 强制）必跑。
  slow-tests:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p ferritls-core --test x25519 -- --ignored

  # 发布（M7）：推 tag v*（或手动 dispatch 填 tag）→ 全量门禁 → 发布
  # crates.io → 创建同名 GitHub Release（附上一 tag 以来的提交变动）。
  # 单次 `cargo publish` 即可：cargo 1.90（2025-09 stable）起支持
  # workspace 一次性发布——按依赖拓扑排序（core → rustls）依次打包、
  # 验证、上传，验证阶段经本地 registry overlay 解析同批发布的依赖，
  # 无需等待 crates.io 索引传播（rust-lang/cargo#1169）。interop 为
  # publish=false，自动跳过。前置：仓库 secrets 配置 CARGO_REGISTRY_TOKEN。
  publish:
    # 全量门禁通过才可发布：格式/clippy、三平台测试、MSRV、fuzz 冒烟、
    # deny（许可+供应链）、audit（RustSec 公告）、文档零警告、慢测试。
    # coverage（度量非门禁）与 semver-checks（仅 PR 阶段生效，破坏性
    # 变更应在合入前被拦）不在此列。
    needs: [fmt, clippy, test, msrv, fuzz, deny, audit, docs, slow-tests]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 发布环境保护：workflow 侧声明环境 crates-io 作为挂载点；仓库
    # Settings → Environments → crates-io 需人工配置 required reviewers
    # 与 deployment tags 限定（v*），发布即需人工批准 + 审计留痕。
    environment: crates-io
    permissions:
      # 创建/编辑 GitHub Release 仅需 contents 写权限（tag 由 push 事件
      # 本身携带），不给更大范围。
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          # Release 注记按 PREV..TAG 提交区间生成，需要完整历史
          # （checkout 默认浅克隆，看不到上一个 tag）。
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches crate version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "Tag: ${TAG} / version: ${VERSION}"
          for crate in ferritls-core ferritls-rustls; do
            CRATE_VERSION=$(cargo metadata --locked --no-deps --format-version 1 | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            echo "${crate}: ${CRATE_VERSION}"
            if [ "${CRATE_VERSION}" != "${VERSION}" ]; then
              echo "::error::${crate} version (${CRATE_VERSION}) does not match tag (${TAG})"
              exit 1
            fi
          done
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # 上传阶段非原子：若 core 已上传而 rustls 失败，重跑本 job 会因
        # core 版本已存在而报错——此时改用 `cargo publish -p
        # ferritls-rustls` 单发补齐即可。--locked：发布产物必须与仓库
        # 提交的 Cargo.lock 一致（发布是 lock 组合的出口，不是重新解析）。
        run: cargo publish --locked
      # crates.io 发布成功后创建同名 GitHub Release，正文列出上一个
      # v* tag 以来的非 merge 提交（无祖先 tag 时列出该 tag 全部提交）。
      # `|| gh release edit` 使重跑幂等（release 已存在时改为更新正文）。
      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${TAG}"
            echo "Changes since ${PREV}"
          else
            RANGE="${TAG}"
            echo "No previous tag; listing commits reachable from ${TAG}"
          fi
          {
            printf '## Changes in %s\n\n' "${TAG}"
            git log --no-merges --pretty='- %s (%h)' "${RANGE}"
            printf '\n[crates.io: ferritls-core %s · ferritls-rustls %s](https://crates.io/crates/ferritls-core/%s)\n' \
              "${TAG#v}" "${TAG#v}" "${TAG#v}"
          } > release-notes.md
          cat release-notes.md
          gh release create "${TAG}" --title "${TAG}" --notes-file release-notes.md \
            || gh release edit "${TAG}" --notes-file release-notes.md
