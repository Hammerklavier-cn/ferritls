[package]
name = "ferritls-interop"
description = "Interop and end-to-end test harness for the ferritls rustls provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]

[dev-dependencies]
# default-features=false + simd 转发：与 ferritls-rustls 相同的
# opt-out 链路（--no-default-features 即可跑全标量路径的互操作矩阵）。
ferritls-core.workspace = true
ferritls-rustls.workspace = true
# ring 作为独立参照实现参与交叉互操作（打破「自握手双方同错也对得上」
# 的盲区）；interop 不发布，dev-deps 不受白名单约束。
rustls = { workspace = true, features = ["ring"] }
criterion = "0.8.2"
# reqwest 0.12 回归防线（tests/reqwest.rs）：manual-roots-no-provider
# 链启用内部 __rustls 而不带任何内建 provider——进程默认必须是
# ferritls（install_default 路径）或显式 use_preconfigured_tls。
# 与 workspace rustls "0.23" 同线，Cargo 统一为同一实例。
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-manual-roots-no-provider",
    "http2",
    "blocking",
] }

[features]
default = ["simd"]
simd = ["ferritls-core/simd", "ferritls-rustls/simd"]

# AES-NI 后端（仅 x86_64）：三方互操作与握手基准的 A/B 对照；ctor 供
# tests/common 的 FERRITLS_TEST_NI 预 main 安装钩子（AGENTS §6.1）。
[target.'cfg(target_arch = "x86_64")'.dev-dependencies]
ferritls-backend-x86_64.workspace = true
ctor.workspace = true

# openssl 对照（openssl_matrix 基准，BENCHMARKS §8）：仅 linux 门控——
# windows/macos 的 CI 测试腿会编译 dev-deps，而 openssl-sys 在这两类
# runner 上无可用开发库；linux（含 ubuntu-latest 的 libssl-dev）开箱即用。
# 链接的是系统 libcrypto，数字随被测机 OpenSSL 版本解读（报告打印版本）。
[target.'cfg(target_os = "linux")'.dev-dependencies]
openssl = "0.10"

# 全握手基准（含 ring 基线对照；软件路径，不安装后端）。
[[bench]]
name = "handshake"
harness = false

# AES-NI 路径对照基准（启动时 install；仅 x86_64 有内容）。
[[bench]]
name = "handshake_ni"
harness = false

# 跨后端 × OpenSSL 对照矩阵（三配置 vs openssl 锚点；simd 与 simd+Ni 经
# 组间安装桥同进程测，标量腿由 tools/bench_matrix.py 以
# --no-default-features 驱动——见 BENCHMARKS §8）。
[[bench]]
name = "openssl_matrix"
harness = false
