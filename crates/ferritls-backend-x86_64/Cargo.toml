[package]
name = "ferritls-backend-x86_64"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
# 独立 keywords：继承 workspace 会带上 `fips`，但本 crate 明确在 FIPS
# 边界外（AGENTS.md 硬性规则 3 的措辞纪律），故单独声明。
keywords = ["cryptography", "tls", "aes", "x86-64", "sha"]
categories.workspace = true
authors.workspace = true
description = "AES-NI + CLMUL + SHA-NI execution core for ferritls-core (out of the FIPS boundary, x86_64 only)"

[dependencies]
ferritls-core = { workspace = true }

[dev-dependencies]
# 基准为 dev 目标（不进入 FIPS 边界，AGENTS.md 硬性规则 2）。
criterion = "0.8.2"

# 软/Ni 逐记录 A/B 基准（本地运行；CI 只编译冒烟）。
[[bench]]
name = "aead_ni"
harness = false

# SHA-256 软/Ni A/B 基准（同进程分安装前后测量）。
[[bench]]
name = "hash_ni"
harness = false
