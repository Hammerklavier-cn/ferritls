[workspace]
resolver = "3"
members = [
    "crates/ferritls-core",
    "crates/ferritls-rustls",
    "crates/ferritls-interop",
    "crates/ferritls-backend-x86_64",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
# MSRV 锚定标量回退路径（--no-default-features）：实测 1.88 全绿、
# 1.85 死于 slice::as_chunks（1.88 稳定）/ is_multiple_of（1.87 稳定）。
# 默认 `simd` feature 经 RUSTC_BOOTSTRAP 跟随「当前 stable」的 core::simd
# 形态（1.88/1.90 的 Simd<T,N> 尚要求 LaneCount bound），不承诺固定
# MSRV——旧工具链可复现构建 = default-features = false（AGENTS §5.5）。
# CI 的 msrv job 按此版本钉定门禁；调低前先实测。
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Hammerklavier-cn/ferritls"
keywords = ["tls", "rustls", "cryptography", "crypto", "fips"]
categories = ["cryptography", "network-programming"]
authors = [
    "Yu Xiaosong <hammerklavier@139.com>" # 于小淞
]

[workspace.dependencies]
# default-features=false + 成员侧 simd/fips feature 转发：使下游的
# opt-out 链路（default-features = false）端到端传导（P2，见各 crate
# Cargo.toml 注释）。
ferritls-core = { version = "0.9.0", path = "crates/ferritls-core", default-features = false }
ferritls-rustls = { version = "0.9.0", path = "crates/ferritls-rustls", default-features = false }
# 边界外硬件后端（仅 x86_64；不进入 FIPS 边界，依赖方向：backend → core）。
ferritls-backend-x86_64 = { version = "0.9.0", path = "crates/ferritls-backend-x86_64" }
rustls = { version = "0.23", default-features = false, features = ["std"] }
# 边界内依赖白名单仅此三者（见 docs/FIPS.md）。getrandom 自 M3/M5 起由
# ferritls-core::entropy 使用；在此之前不得引入其他依赖。
getrandom = "0.2"
subtle = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false }

[profile.release]
lto = "thin"
